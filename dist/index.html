// Lista reutilizable: formulario + tabla + eliminar. fields = [[campo, etiqueta, atributos]]
function crud(root, { key, title, fields }) {

    const list = db.get(key);
    root.innerHTML = `<div class="card"><h3>${title}</h3><form class="form">${fields.map(f => `<label>${f[1]}<input name="${f[0]}" ${f[2] || ''}></label>`).join('')}</form>

      <div class="tablewrap"><table><thead><tr>${fields.map(f => `<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>
      ${list.map(r => `<tr>${fields.map(f => `<td>${esc(r[f[0]])}</td>`).join('')}<td><button class="btn bad sm" data-d="${r.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>
      ${list.length ? '' : '<div class="empty">Sin registros todavía.</div>'}</div>`;
    root.querySelector('[data-s]').onclick = () => { const f = root.querySelector('form'); if (!f.reportValidity()) return; db.add(key, Object.fromEntries(new FormData(f))); draw(); };
    root.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { if (confirm('¿Eliminar?')) { db.remove(key, b.dataset.d); draw(); } });
  };
  draw();
}

// El docente define cómo califica cada materia (componentes y %), y decide cuándo mostrar las notas.
function grades(root, { tid }) {
  const mine = db.get('asignaciones').filter(a => a.tid === tid).map(a => [a.grado, a.materia]);
  const aulas = db.get('aulas').map(a => [a.grado, a.materia]);
  const pairs = mine.length ? mine : aulas.length ? aulas : gradeList().flatMap(g => db.get('materias').map(m => [g, m.nombre]));
  let ai = 0, p = '1';
  const draw = () => {
    if (!pairs.length) { root.innerHTML = '<div class="card empty">Aún no hay aulas. Dirección debe crear grados, materias y asignarte tus cursos.</div>'; return; }
    const [g, m] = pairs[ai] || pairs[0], cfg = cfgFor(g, m), sum = cfg.reduce((a, c) => a + Number(c[1]), 0), key = `${g}|${m}|${p}`;
    const saved = db.get('notes', {})[key] || {}, list = db.get('students').filter(s => s.grado === g), vis = !!db.get('evalvis', {})[key];
    root.innerHTML = `<h2 class="pt">📝 Registro de calificaciones</h2>
    <div class="card"><div class="form"><label>Aula<select id="a">${pairs.map((x, i) => `<option value="${i}" ${i === ai ? 'selected' : ''}>${esc(x[1])} · ${esc(x[0])}</option>`).join('')}</select></label>

    } else {
      rows = st.map(x => { const c = { P: 0, A: 0, T: 0, J: 0 }; db.get('attendance').filter(r => r.grado === g && (!from || r.date >= from) && (!to || r.date <= to)).forEach(r => { const k = r.marks[x.id]; if (k) c[k]++; }); const tot = c.P + c.A + c.T + c.J; return { x, c, pct: tot ? Math.round((c.P + c.T) * 100 / tot) : null }; });
      cols = [{ h: '#', f: (r, i) => i }, { h: 'Alumno', f: r => esc(r.x.apellidos) + ', ' + esc(r.x.nombres) }, { h: 'Presente', f: r => r.c.P }, { h: 'Ausente', f: r => r.c.A }, { h: 'Tardanza', f: r => r.c.T }, { h: 'Justificada', f: r => r.c.J }, { h: '% asistencia', f: r => r.pct === null ? '—' : badge(r.pct + '%', r.pct >= 85 ? 'ok' : 'bad') }];
      csv = () => exportCSV('reporte-asistencia', ['Alumno', 'Presente', 'Ausente', 'Tardanza', 'Justificada', '%'], rows.map(r => [r.x.apellidos + ' ' + r.x.nombres, r.c.P, r.c.A, r.c.T, r.c.J, r.pct ?? '']));
    }
    root.innerHTML = `<h2 class="pt">📑 Reportes de notas y asistencia</h2><div class="card"><div class="hint" style="margin:0 0 1rem">Solo consulta: las calificaciones y la asistencia las registra cada docente desde su panel.</div>
      <div class="tabsb"><button data-t="notas" class="${tab === 'notas' ? 'on' : ''}">Calificaciones</button><button data-t="asist" class="${tab === 'asist' ? 'on' : ''}">Asistencia</button></div>
      <div class="form"><label>Grado<select id="g">${opt(gradeList(), g)}</select></label>
      ${tab === 'notas' ? `<label>Materia<select id="m">${opt(db.get('materias').map(x => x.nombre), m)}</select></label><label>Período<select id="p">${opt(['1', '2', '3', '4'], p)}</select></label>` : `<label>Desde<input type="date" id="f" value="${from}"></label><label>Hasta<input type="date" id="t2" value="${to}"></label>`}</div>
      <div id="t"></div></div>
      <div class="card"><h3>🖨️ Boletín individual</h3><div class="form"><label>Alumno de ${esc(g)}<select id="bs">${st.map(x => `<option value="${x.id}">${esc(x.apellidos)}, ${esc(x.nombres)}</option>`).join('')}</select></label></div><div class="actions"><button class="btn" id="bp">Ver y imprimir boletín</button></div></div>`;
    table(root.querySelector('#t'), { rows, cols, tools: '<button class="btn ghost sm" id="csv">Excel / CSV</button><button class="btn ghost sm" onclick="print()">Imprimir</button>' });
    root.querySelector('#csv').onclick = csv;
    const bind = (id, fn) => { const e = root.querySelector(id); if (e) e.onchange = ev => { fn(ev.target.value); draw(); }; };
    root.querySelector('#bp').onclick = () => { const x = st.find(y => y.id === root.querySelector('#bs').value); if (x) showPrint(boletinHTML(x, true)); else alert('No hay alumnos en este grado.'); };
    bind('#g', v => g = v); bind('#m', v => m = v); bind('#p', v => p = v); bind('#f', v => from = v); bind('#t2', v => to = v);
    root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  };
  draw();
}

    <div class="grid"><div class="stat s5"><div class="ic">✅</div><div class="t"><small>Asistencia general</small><b>${k.att === null ? '—' : k.att + '%'}</b></div></div><div class="stat s1"><div class="ic">📅</div><div class="t"><small>Días registrados</small><b>${rows.length}</b></div></div></div>

function audit(root) {

// Dirección: supervisa TODAS las aulas virtuales (solo consulta)
function classrooms(root) {
  let sel = null;
  const stats = a => {
    const st = db.get('students').filter(x => x.grado === a.grado), cfg = cfgFor(a.grado, a.materia), notes = db.get('notes', {}), id = a.grado + '|' + a.materia;
    const avgOf = sid => { const t = []; for (let p = 1; p <= 4; p++) { const v = (notes[`${id}|${p}`] || {})[sid]; if (v && v.some(x => x !== '')) t.push(v.reduce((s, x, i) => s + (Number(x) || 0) * (cfg[i] ? cfg[i][1] : 0) / 100, 0)); } return t.length ? t.reduce((x, y) => x + y, 0) / t.length : null; };
    const av = st.map(x => avgOf(x.id)).filter(v => v !== null);
    return { st, avgOf, avg: av.length ? av.reduce((x, y) => x + y, 0) / av.length : null, posts: db.get('posts').filter(p => p.aula === id) };
  };
  const draw = () => {
    const aulas = db.get('aulas').map(a => ({ ...a, ...stats(a) })), cur = aulas.find(a => a.id === sel);
    root.innerHTML = `<h2 class="pt">🏫 Aulas virtuales · supervisión</h2><div class="card"><div class="hint" style="margin:0 0 1rem">Vista de solo consulta para Dirección. Las aulas se crean desde el Dashboard y cada docente publica en las suyas.</div><div id="t"></div></div>
    ${cur ? `<div class="cols"><div class="card"><h3>${courseIcon(cur.materia)} ${esc(cur.materia)} · ${esc(cur.grado)}</h3><p style="margin-top:0">Docente: <b>${esc(cur.docente)}</b></p>
      <div class="tablewrap"><table><thead><tr><th>Alumno</th><th>Promedio de la materia</th></tr></thead><tbody>${cur.st.map(x => { const v = cur.avgOf(x.id); return `<tr><td>${esc(x.apellidos)}, ${esc(x.nombres)}</td><td>${v === null ? badge('Pendiente', 'warn') : badge(v.toFixed(1), v >= 70 ? 'ok' : 'bad')}</td></tr>`; }).join('') || '<tr><td colspan="2" class="empty">Sin alumnos en este grado</td></tr>'}</tbody></table></div></div>
      <div class="card"><h3>Actividad del aula</h3>${cur.posts.slice().reverse().map(p => `<div class="post ${esc(p.tipo)}"><b>${p.tipo === 'tarea' ? '📝' : '📣'} ${esc(p.titulo)}</b> ${p.fecha ? badge('Entrega ' + p.fecha, 'warn') : ''}<p style="margin:.2rem 0 0">${esc(p.texto)}</p></div>`).join('') || '<div class="empty">El docente aún no ha publicado en esta aula.</div>'}</div></div>` : ''}`;
    table(root.querySelector('#t'), { rows: aulas, size: 6, cols: [{ h: 'Aula', f: r => courseIcon(r.materia) + ' <b>' + esc(r.materia) + '</b>' }, { h: 'Grado', f: r => esc(r.grado) }, { h: 'Docente', f: r => esc(r.docente) }, { h: 'Alumnos', f: r => r.st.length }, { h: 'Publicaciones', f: r => r.posts.length }, { h: 'Promedio', f: r => r.avg === null ? '—' : r.avg.toFixed(1) }, { h: '', f: r => `<button class="btn sm ${r.id === sel ? '' : 'ghost'}" data-v="${r.id}">Ver detalle</button>` }] });
  };
  root.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { sel = b.dataset.v; draw(); } });
  draw();
}

function notifs(root) {
  const draw = () => {
    const cfg = notifCfg(), st = db.get('students'), unpaid = new Set(db.get('pagos').filter(p => p.estado !== 'Pagado').map(p => p.id));
    const rows = db.get('notifs').slice().reverse().map(n => { const s = st.find(x => x.id === n.sid) || {}, tel = String(s.madre_tel || s.padre_tel || '').replace(/\D/g, ''); return { ...n, alumno: s.nombres ? s.nombres + ' ' + s.apellidos : '(eliminado)', wa: tel ? 'https://wa.me/' + (tel.length === 10 ? '1' + tel : tel) + '?text=' + encodeURIComponent(n.mensaje) : '', resuelta: !unpaid.has(n.clave.split('|')[0]) }; });
    root.innerHTML = `<h2 class="pt">🔔 Notificaciones automáticas a las familias</h2>
    <div class="card"><h3>Reglas</h3><div class="hint" style="margin:0 0 1rem">El sistema revisa los pagos cada vez que alguien abre la plataforma y deja el recordatorio listo. Las familias lo ven en la campana 🔔. El envío automático real por correo o WhatsApp se activa al conectar el servidor; mientras tanto puedes enviarlo con el botón WhatsApp.</div>
    <div class="form"><label>Días de anticipación<input id="dias" type="number" min="0" max="30" value="${cfg.dias}"></label><label>Avisar pagos vencidos<select id="venc"><option value="1" ${cfg.vencidos ? 'selected' : ''}>Sí</option><option value="0" ${cfg.vencidos ? '' : 'selected'}>No</option></select></label>
    <div><small style="color:var(--c-muted)">Canales</small><div style="display:flex;gap:1rem;flex-wrap:wrap;padding-top:.6rem">${['App', 'Correo', 'WhatsApp'].map(c => `<label style="flex-direction:row;gap:.3rem;align-items:center;color:var(--c-text)"><input type="checkbox" data-c="${c}" ${cfg.canales.includes(c) ? 'checked' : ''} style="width:auto;min-height:0"> ${c}</label>`).join('')}</div></div>
    <label style="grid-column:1/-1">Mensaje · pago próximo<textarea id="pl1" rows="2">${esc(cfg.plantilla)}</textarea></label><label style="grid-column:1/-1">Mensaje · pago vencido<textarea id="pl2" rows="2">${esc(cfg.plantillaVencido)}</textarea></label></div>
    <small style="color:var(--c-muted)">Variables: {tutor} {alumno} {concepto} {fecha} {monto}</small><div class="actions"><button class="btn" id="save">Guardar reglas</button><button class="btn ghost" id="scan">Revisar vencimientos ahora</button></div></div>
    <div class="card"><h3>Cola de mensajes</h3><div id="t"></div></div>`;
    table(root.querySelector('#t'), { rows, size: 6, cols: [{ h: 'Fecha', f: r => esc(r.creada) }, { h: 'Alumno', f: r => esc(r.alumno) }, { h: 'Tipo', f: r => badge(r.tipo, r.tipo === 'Pago vencido' ? 'bad' : 'warn') }, { h: 'Mensaje', f: r => `<small>${esc(r.mensaje)}</small>` }, { h: 'Canales', f: r => esc((r.canales || []).join(', ')) },
      { h: 'Estado', f: r => r.resuelta ? badge('Resuelta (pagado)', 'ok') : badge(r.estado, r.estado === 'Enviada' ? 'ok' : 'info') },
      { h: 'Acción', f: r => `${r.wa ? `<a class="btn ok sm" target="_blank" rel="noopener" href="${esc(r.wa)}">WhatsApp</a> ` : ''}${r.estado !== 'Enviada' ? `<button class="btn ghost sm" data-s="${r.id}">Marcar enviada</button> ` : ''}<button class="btn bad sm" data-x="${r.id}">🗑️</button>` }] });
    root.querySelector('#save').onclick = () => { db.set('notifcfg', { dias: Number(root.querySelector('#dias').value) || 0, vencidos: root.querySelector('#venc').value === '1', canales: [...root.querySelectorAll('[data-c]')].filter(c => c.checked).map(c => c.dataset.c), plantilla: root.querySelector('#pl1').value, plantillaVencido: root.querySelector('#pl2').value }); alert('Reglas guardadas.'); draw(); };
    root.querySelector('#scan').onclick = () => { const n = scanPayments(); alert(n ? n + ' recordatorio(s) nuevo(s) en la cola.' : 'No hay recordatorios nuevos.'); draw(); };
  };
  root.addEventListener('click', e => { const b = e.target.closest('[data-s],[data-x]'); if (!b) return; if (b.dataset.s) db.set('notifs', db.get('notifs').map(n => n.id === b.dataset.s ? { ...n, estado: 'Enviada' } : n)); else db.remove('notifs', b.dataset.x); draw(); });
  draw();
}


const pages = { dashboard, students, enroll, teachers, schedule, academic, requests, payments, finance, avisos, reports, settings, audit, attendance, grades, classroom, courses, mynotes, myatt, classrooms, notifs };
const app = document.getElementById('app'), KEY = 'eduplat:session';
const session = () => { try { return JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch { return null; } };
const keysOf = r => MENUS[r].flatMap(it => it.c ? it.c.map(c => c[0]) : [it.k]);

function login() {
  const last = (() => { try { return localStorage.getItem('eduplat:lastuser') || ''; } catch { return ''; } })();
  app.innerHTML = `<div class="lg2"><div class="brandp"><div class="mark">S$</div><h1>Sistema de Gestión Escolar</h1><p>Un solo lugar para dirección, docentes, estudiantes y familias.</p>
    <ul><li>✔ Matrícula, expedientes y aulas virtuales</li><li>✔ Asistencia y calificaciones en línea</li><li>✔ Pagos y contabilidad</li><li>✔ Una vista distinta para cada rol</li></ul></div>
    <div class="fp"><div class="fb"><h2>Iniciar sesión</h2><p>Ingresa con tu usuario y contraseña.</p>
    <form id="lf" class="form" style="grid-template-columns:1fr" autocomplete="off"><label>Usuario<input name="u" value="${esc(last)}" placeholder="Ej. admin" autofocus></label>
    <label>Contraseña<div class="pw"><input name="p" id="p" type="password" placeholder="••••••••"><button type="button" id="eye" title="Mostrar contraseña">👁️</button></div></label>
    <label class="ck"><input type="checkbox" name="rem" ${last ? 'checked' : ''}> Recordarme</label><div class="err" id="err"></div><button class="btn" style="min-height:46px">Ingresar</button></form>
    <details><summary>Usuarios de demostración</summary><p style="margin:.5rem 0 0">admin / admin1234<br>docente / docente1234<br>estudiante / estudiante1234<br>padre / padre1234</p></details></div></div></div>`;
  app.querySelector('#eye').onclick = () => { const p = app.querySelector('#p'); p.type = p.type === 'password' ? 'text' : 'password'; };
  app.querySelector('#lf').onsubmit = e => {
    e.preventDefault(); const d = new FormData(e.target), u = String(d.get('u')).trim().toLowerCase(), f = DEMO_USERS.find(x => x.u === u && x.p === d.get('p'));
    if (!u || !d.get('p')) return app.querySelector('#err').textContent = 'Escribe tu usuario y contraseña.';
    if (!f) return app.querySelector('#err').textContent = 'Usuario o contraseña incorrectos.';
    try { d.get('rem') ? localStorage.setItem('eduplat:lastuser', u) : localStorage.removeItem('eduplat:lastuser'); } catch { /* sin almacenamiento */ }
    sessionStorage.setItem(KEY, JSON.stringify({ role: f.role, name: f.name, user: f.u })); location.hash = ''; route();
  };
}

// Vincula la sesión con los registros guardados (alumno, hijos, docente)
function refresh(s) {
  const st = db.get('students'), t = db.get('teachers');
  if (s.role === 'parent') { s.kids = st.filter(x => x.familia === s.user).map(x => x.id); if (!s.kids.length && st[0]) s.kids = [st[0].id]; if (!s.kids.includes(s.sid)) s.sid = s.kids[0]; }
  else if (s.role === 'student') { const m = st.find(x => x.usuario === s.user) || st[0]; s.sid = m?.id; if (m) s.name = m.nombres + ' ' + m.apellidos; }
  else if (s.role === 'teacher') { const m = t.find(x => x.usuario === s.user) || t[0]; s.tid = m?.id; if (m) s.name = m.nombres + ' ' + m.apellidos; }
  db.user = s.name; sessionStorage.setItem(KEY, JSON.stringify(s));
}

function nav(role) {
  return MENUS[role].map(it => it.c
    ? `<div class="grp"><button class="gh" type="button"><span>${it.i}</span><span>${it.l}</span><i>▾</i></button><div class="gc">${it.c.map(c => `<a href="#${c[0]}${c[2] ? '/' + c[2] : ''}" data-k="${c[0]}" data-s="${c[2] || ''}">${c[1]}</a>`).join('')}</div></div>`
    : `<a class="top1" href="#${it.k}" data-k="${it.k}" data-s=""><span>${it.i}</span><span>${it.l}</span></a>`).join('');
}

function shell(s) {
  const inst = db.get('inst', {}), nm = esc(inst.name || 'Education Platform');
  app.innerHTML = `<aside class="side"><div class="brand">${inst.logo ? `<img src="${inst.logo}" alt="">` : '<span class="avatar" style="width:34px;height:34px;font-size:.85rem">S$</span>'} <span>${nm}</span></div>
    <div class="user"><div class="avatar" id="av"></div><div><b id="un"></b><small>● Online</small></div></div>
    <input class="sq" id="sq" placeholder="🔍 Buscar en el menú..."><nav>${nav(s.role)}</nav></aside><div class="ov" id="ov"></div>
    <div class="main"><header class="top"><button class="iconbtn" id="burger">☰</button><strong>${nm}</strong><span class="chip">${esc(inst.year || '2026-2027')}</span><span class="grow"></span>
    ${s.role === 'parent' ? '<select id="kidsel" title="Hijo/a"></select>' : ''}<button class="iconbtn" id="bell" title="Notificaciones">🔔</button><span class="chip hide" id="rc"></span><button class="btn ghost sm" id="out">Cerrar sesión</button></header><main id="view"></main></div>`;
  const q = app.querySelector('#sq');
  q.oninput = () => { const t = q.value.toLowerCase(); app.querySelectorAll('nav a').forEach(a => a.style.display = !t || a.textContent.toLowerCase().includes(t) ? '' : 'none');
    app.querySelectorAll('.grp').forEach(g => { const any = [...g.querySelectorAll('a')].some(a => a.style.display !== 'none'); g.style.display = any ? '' : 'none'; if (t && any) g.classList.add('open'); }); };
  app.querySelectorAll('.gh').forEach(b => b.onclick = () => b.parentElement.classList.toggle('open'));
  app.querySelector('#burger').onclick = () => document.body.classList.toggle('nav');
  app.querySelector('#ov').onclick = () => document.body.classList.remove('nav');
  app.querySelector('#bell').onclick = () => { const x = session() || s, unpaid = new Set(db.get('pagos').filter(p => p.estado !== 'Pagado').map(p => p.id));
    const nt = x.role === 'parent' ? db.get('notifs').filter(n => (x.kids || []).includes(n.sid) && unpaid.has(n.clave.split('|')[0])).reverse().map(n => `<div class="post tarea"><b>🔔 ${esc(n.asunto)}</b><p style="margin:.2rem 0 0">${esc(n.mensaje)}</p></div>`).join('') : '';
    modal('Notificaciones', nt + db.get('posts').slice(-6).reverse().map(p => `<div class="post ${esc(p.tipo)}"><b>${esc(p.titulo)}</b><p style="margin:.2rem 0 0">${esc(p.texto)}</p></div>`).join('') || '<div class="empty">No hay notificaciones.</div>'); };
  app.querySelector('#out').onclick = () => { sessionStorage.removeItem(KEY); document.body.classList.remove('nav'); route(); };
  app.querySelector('#kidsel')?.addEventListener('change', e => { const x = session(); x.sid = e.target.value; sessionStorage.setItem(KEY, JSON.stringify(x)); route(); });
}

const ROLE_LABEL = { admin: 'Dirección', teacher: 'Docente', student: 'Estudiante', parent: 'Madre / Tutor' };
function route() {
  const s = session(); if (!s || !MENUS[s.role]) return login();
  refresh(s);
  try { scanPayments(); } catch { /* sin datos */ }
  if (!document.getElementById('view')) shell(s);
  document.body.classList.remove('nav');
  app.querySelector('#un').textContent = s.name; app.querySelector('#av').textContent = initials(s.name.split(' ')[0], s.name.split(' ')[1]); app.querySelector('#rc').textContent = ROLE_LABEL[s.role];
  const ks = app.querySelector('#kidsel'); if (ks) { const st = db.get('students'); ks.innerHTML = (s.kids || []).map(id => { const x = st.find(y => y.id === id); return x ? `<option value="${id}" ${id === s.sid ? 'selected' : ''}>${esc(x.nombres)} ${esc(x.apellidos)} · ${esc(x.grado)}</option>` : ''; }).join('') || '<option>Sin hijos vinculados</option>'; }
  const [k, sub = ''] = location.hash.slice(1).split('/'), key = keysOf(s.role).includes(k) ? k : 'dashboard';
  document.querySelectorAll('.side a').forEach(a => { const on = a.dataset.k === key && a.dataset.s === sub; a.classList.toggle('on', on); if (on) a.closest('.grp')?.classList.add('open'); });
  const v = document.getElementById('view'), fresh = v.cloneNode(false); v.replaceWith(fresh); // limpia eventos de la pantalla anterior
  try { pages[key](fresh, { ...s, sub }); } catch (e) { fresh.innerHTML = `<div class="card"><h3>⚠️ Ocurrió un error en esta pantalla</h3><p>${esc(e.message)}</p><button class="btn" onclick="location.hash='';location.reload()">Volver al inicio</button></div>`; }
}
addEventListener('hashchange', route);
try { route(); } catch (e) { app.innerHTML = `<div style="padding:2rem"><h3>⚠️ Error al iniciar</h3><p>${esc(e.message)}</p><button onclick="sessionStorage.clear();location.reload()">Reiniciar sesión</button></div>`; }

</script></body></html>
